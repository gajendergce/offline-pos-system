server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    # Max upload size — match PHP limits
    client_max_body_size 50M;

    # Serve static files directly; fall back to Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP files to php-fpm on the app container.
    # Use a fixed path because this nginx container does not have app code mounted.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Block access to hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
    }

    # Deny direct access to sensitive Laravel directories
    location ~* ^/(storage|bootstrap/cache) {
        deny all;
    }

    # Cache static assets in browser for 30 days
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
